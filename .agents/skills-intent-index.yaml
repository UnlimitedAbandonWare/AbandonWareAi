# Fallback when no intent scores: proceed without a skill. Do not force one.
# Display/RAG/LLM scope가 불명확하게 섞인 요청만 사람이 demo1-core-request-router로 분류.
fallback:
  primary_skill: null
  notes: no intent matched — work directly; skill 선택을 억지로 하지 않는다
