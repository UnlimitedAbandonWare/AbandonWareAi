# demo-1 vibe skill router — intent index (SSOT)
#
# Default entry for user asks: `python -B scripts/demo1_vibe_skill_router.py resolve "<user text>"`
# resolves ONE primary skill (+ at most one optional). Edit intents/families
# here only; the router script and demo1-vibe-skill-router SKILL.md read this file.
#
# match: substring patterns (case-insensitive). Prefix a pattern with `re:` for regex.
# score = count of matched patterns; highest score wins; ties keep file order.
# soft: low-precision paraphrase cues scored ONLY when every `match` misses —
#   a soft hit picks one intent before the `fallback:` block is used.
# forbid_families: suppressed unless the user text matches a family `unlock` pattern.
# explicit: true on an intent = it only wins when the user names that gated flow,
# and any scored explicit intent outranks generic intents (score 무관).
# family `veto: hard` (default) drops the family's skills from the result;
# `veto: soft` keeps them and reports `veto_relaxed` — advisory-only skills may
# stay routed; destructive pipelines (macsrc-patchdrop) stay hard.

schemaVersion: 1

# Suppressed by default on every intent (Grok audit: entry sprawl + ceremony).
families:
  counter-evidence:
    veto: soft
    note: falsifiable→retrieve→triangulate→verify→minority chain; only on explicit ask
    unlock:
      - counter-evidence
      - counter evidence
      - 반증
      - falsifiable
      - triangulat
      - minority signal
    skills:
      - demo1-triangulating-counter-evidence
  macsrc-patchdrop:
    veto: hard
    note: MacSrc/PatchDrop/SMB intake→guard→postprocess maze; only when user names it
    unlock:
      - patchdrop
      - patch drop
      - patch_drop
      - __patch_drop__
      - macsrc
      - mac src
      - smb
    skills:
      - demo1-macsrc-smb-direct-patch
      - patchdrop-safe-patch-orchestrator
  triad:
    veto: soft
    note: positive/negative/neutral deliberation; only on explicit 심의/cross-check ask
    unlock:
      - triad
      - deliberat
      - positive negative
      - 긍정 부정 중립
      - 심의
      - cross-check
      - 교차 검증
    skills:
      - demo1-triad-deliberation
      - positive-negative-neutral-judge

default_forbid_families:
  - counter-evidence
  - macsrc-patchdrop
  - triad

# 난이도 자동 승격(auto-promote, 2026-10-04 skill-performance tiering):
# 질의 속 고난도 시그널이 켜지면 resolve()가 결과를 고성능 스킬로 승격하고
# tier별 unlock_families를 forbid 해금에 더한다. tier0_light=기본(출력 필드
# 추가 없음) < tier1_tactical < tier2_strategic. 승격 시에만 tier/tierSignals/
# autoPromotedFrom이 붙는다. 시그널·스킬 매핑·해금은 여기서 조정한다.
auto_promote:
  # 불변 가드: 어떤 tier로 승격해도 항상 함께 적용된다. 승격 출력의 `guards`
  # 필드로 에코된다(콘솔 출력 ≤30줄/1KB, 상세는 var/diagnostics/ 경로만 참조).
  invariant_guards:
    - demo1-output-budget
    - demo1-session-state-checkpoint
  # multi_subsystem: 아래 이름 중 서로 다른 2개 이상이 질의에 나타나면
  # tier2 시그널 1개로 계산한다(단일 서브시스템 패치는 승격하지 않는다).
  subsystem_names:
    - extremez
    - extreme-z
    - overdrive
    - cfvm
    - moe
  tier1_tactical:
    # 복합 로직·첫 실패 — primary 유지 + evidence-debugging 자동 페어링
    signals:
      - 복합 로직
      - 복합 디버깅
      - 첫 테스트 실패
      - 첫 시도 실패
      - 1차 테스트 실패
      - re:첫\s*(번째)?\s*(시도|테스트|빌드).{0,8}실패
      - first test fail
      - first attempt fail
    optional_skill: demo1-evidence-debugging
    unlock_families: []
  tier2_strategic:
    # 복합 서브시스템 충돌·반복 실패 루프·아키텍처 재설계·정교/완벽/근본 요청 —
    # 3축 심의 + 반증 체인 자동 발동 (반복 실패는 회수 명시 패턴만: bare '반복'은
    # blocker-recovery 같은 기존 인텐트를 훔치지 않게 회수 토큰을 요구한다)
    signals:
      - multi_subsystem
      - 복합 서브시스템
      - 서브시스템 충돌
      - cross-subsystem
      - multi-subsystem
      - re:\d+\s*(회|번|차)\s*이상.{0,16}(실패|재시도|오류|에러)
      - re:(실패|재시도|오류|에러).{0,16}\d+\s*(회|번|차)\s*이상
      - re:(실패|재시도|오류|에러).{0,8}(두|세|여러)\s*(번|회|차)
      - 실패 루프
      - 재시도 루프
      - failure loop
      - retry loop
      - 동일 실패 반복
      - 같은 실패 반복
      - 아키텍처 재설계
      - 구조 재설계
      - 근본적으로
      - 근본 원인 재설계
      - 정교히
      - 완벽히
    primary_skill: demo1-triad-deliberation
    optional_skill: demo1-triangulating-counter-evidence
    unlock_families:
      - triad
      - counter-evidence

