# demo-1 vibe skill router — intent index (SSOT)
#
# Default entry for user asks: `python -B scripts/demo1_vibe_skill_router.py resolve "<user text>"`
# resolves ONE primary skill (+ at most one optional). Edit intents/families
# here only; the router script and demo1-vibe-skill-router SKILL.md read this file.
#
# match: substring patterns (case-insensitive). Prefix a pattern with `re:` for regex.
# score = count of matched patterns; highest score wins; ties keep file order.
# forbid_families: suppressed unless the user text matches a family `unlock` pattern.
# explicit: true on an intent = it only wins when the user names that gated flow,
# and any scored explicit intent outranks generic intents (score 무관).

schemaVersion: 1

# Suppressed by default on every intent (Grok audit: entry sprawl + ceremony).
families:
  counter-evidence:
    note: falsifiable→retrieve→triangulate→verify→minority chain; only on explicit ask
    unlock:
      - counter-evidence
      - counter evidence
      - 반증
      - falsifiable
      - triangulat
      - minority signal
    skills:
      - demo1-generating-falsifiable-hypotheses
      - demo1-retrieving-counter-evidence
      - demo1-triangulating-counter-evidence
      - demo1-verifying-evidence-coherence
      - demo1-forecasting-minority-signals
  macsrc-patchdrop:
    note: MacSrc/PatchDrop/SMB intake→guard→postprocess maze; only when user names it
    unlock:
      - patchdrop
      - patch drop
      - patch_drop
      - __patch_drop__
      - macsrc
      - mac src
      - smb
    skills:
      - demo1-macsrc-defect-intake
      - demo1-macsrc-guarded-patch-session
      - demo1-macsrc-patch-postprocessor
      - demo1-macsrc-smb-direct-patch
      - demo1-patchdrop-manual-default
      - macmini-safe-patch-assistant
      - patchdrop-safe-patch-orchestrator
      - desktop-smb-ack
      - notebook-smb-handoff
  triad:
    note: positive/negative/neutral deliberation; only on explicit 심의/cross-check ask
    unlock:
      - triad
      - deliberat
      - positive negative
      - 긍정 부정 중립
      - 심의
      - cross-check
      - 교차 검증
    skills:
      - demo1-triad-deliberation
      - positive-negative-neutral-judge

default_forbid_families:
  - counter-evidence
  - macsrc-patchdrop
  - triad

intents:
  # --- explicit-ask intents first: `explicit: true` makes a scored one win over
  #     generic intents like source-write even at lower raw score ---
  - intent: patchdrop-apply
    explicit: true
    match:
      - patchdrop
      - patch drop
      - patch_drop
      - __patch_drop__
      - smb handoff
      - macsrc
      - mac src
    primary_skill: patchdrop-safe-patch-orchestrator
    optional_skill: null
    forbid_families: []
    notes: 사용자가 PatchDrop/SMB/MacSrc를 명시한 경우에만 도달(가족 unlock과 같은 키워드)

  - intent: triad-review
    explicit: true
    match:
      - triad
      - 심의
      - 긍정 부정 중립
      - positive negative neutral
      - cross-check
      - 교차 검증
    primary_skill: demo1-triad-deliberation
    optional_skill: positive-negative-neutral-judge
    forbid_families: []
    notes: 명시적 심의 요청 전용; 일반 ambiguous 결정에 자동 진입 금지

  - intent: counter-evidence
    explicit: true
    match:
      - counter-evidence
      - counter evidence
      - 반증
      - falsifiable
      - triangulat
      - minority signal
    primary_skill: demo1-triangulating-counter-evidence
    optional_skill: demo1-generating-falsifiable-hypotheses
    forbid_families: []
    notes: 명시적 반증 요청 전용; 바이브 지시의 기본 검증 경로가 아님

  - intent: meta-display
    match:
      - meta display
      - meta-display
      - ray-ban
      - rayban
      - 렌즈
      - lens
      - cuehint
      - 안경
      - fold6
      - 캡션
      - caption
    primary_skill: demo1-meta-display-simple-caption
    optional_skill: demo1-meta-display-webapp
    forbid_families: []
    notes: lens text/caption/표시 설정; webapp·sync·verification 역할은 demo1-core-request-router phase 분류 경유

  - intent: chat-exact-model
    match:
      - /chat 모델
      - /chat model
