# DEMO1 agent path registry (SSOT). Read/write ONLY through the resolver:
#   python -B scripts/awx_paths.py where <key>
#   . scripts/AwxPaths.ps1 ; Resolve-AwxPath -Key <key>
# Rules: new paths register here first; moves leave an alias (junction or
# pointer) plus one line in data/agent-handoff/_path-moves/moved.jsonl.
# status: FROZEN=never move without human approval | ALIASED=name registered,
# physical move deferred | MOVE-SAFE=eligible under the 5-condition gate |
# STABLE=correct as-is. env overrides the stored path when set.
# Restricted YAML subset (2-space indent, inline [a, b] lists, null scalars).
version: 1
paths:
  repo.root:
    path: .
    env: AWX_ROOT
    status: FROZEN
    owner: all-agents
    consumers: [scripts/awx_paths.py, scripts/AwxPaths.ps1]
    old_paths: []
    moved_at: null
  scripts.dir:
    path: scripts
    env: AWX_PATH_SCRIPTS_DIR
    status: STABLE
    owner: tooling
    consumers: [scripts/work_journal.py, scripts/agent_preflight.py]
    old_paths: []
    moved_at: null
  configs.dir:
    path: configs
    env: AWX_PATH_CONFIGS_DIR
    status: STABLE
    owner: tooling
    consumers: [configs/api-routing.yaml, configs/agent-paths.yaml]
    old_paths: []
    moved_at: null
  docs.agents_rules:
    path: docs/agents-rules
    env: AWX_PATH_DOCS_AGENTS_RULES
    status: STABLE
    owner: docs
    consumers: [AGENTS.md, docs/agents-rules/DEMO1-PATH-REGISTRY-SSOT.md]
    old_paths: []
    moved_at: null
  docs.diagnostics:
    path: docs/diagnostics
    env: AWX_PATH_DOCS_DIAGNOSTICS
    status: STABLE
    owner: docs
    consumers: [scripts/work_journal.py, docs/PROJECT_STATUS.md]
    old_paths: []
    moved_at: null
  agent_prompts.dir:
    path: agent-prompts
    env: AWX_PATH_AGENT_PROMPTS
    status: STABLE
    owner: agents
    consumers: [agent-prompts/nova-focus]
    old_paths: []
    moved_at: null
  handoff.root:
    path: data/agent-handoff
    env: AWX_PATH_HANDOFF_ROOT
    status: FROZEN
    owner: multi-agent
    consumers: [scripts/work_journal.py, scripts/codex_work_checkpoint.py, main/java/com/example/lms/tools/DbEvidenceScanTool.java]
    old_paths: []
    moved_at: null
  journal.base:
    path: data/agent-handoff/codex-autonomy
    env: AWX_PATH_JOURNAL_BASE
