<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=600, height=600, initial-scale=1.0, user-scalable=no">
<meta name="mrbd-web-app-capable" content="yes">
<meta name="description" content="AWX Meta Ray-Ban Display quiet text lens">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#000000">
<title>AWX Meta Display</title>
<style>
* { box-sizing: border-box; }
html, body { width: 600px; height: 600px; margin: 0; overflow: hidden; background: #000; color: #fff; }
body { display: flex; align-items: stretch; padding: 8px; font-family: "Malgun Gothic", system-ui, sans-serif; }
.stage {
  position: relative;
  width: 100%; height: 100%;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
  grid-template-areas: "cue" "cap" "status";
  gap: 10px;
  padding: 10px 12px 18px;
  border: 1px solid #fff;
  border-radius: 12px;
  overflow: hidden;
}
#hint {
  grid-area: cue;
  margin: 0;
  min-height: 0;
  font-size: var(--hint-font, 26px);
  font-weight: 700;
  line-height: 1.25;
  letter-spacing: -0.02em;
  color: #fff;
  max-height: calc(1.25em * var(--hint-lines, 11));
  overflow: hidden;
  overflow-wrap: anywhere;
  white-space: normal;
}
#transcript {
  grid-area: cap;
  margin: 0;
  /* Fixed small gray from first show; hint presence never restyles it. */
  align-self: end;
  justify-self: stretch;
  min-height: 0;
  max-height: calc(1.25em * var(--cap-lines, 4));
  font-size: var(--cap-font, 26px);
  font-weight: 500;
  line-height: 1.25;
  color: #a8adb3;
  overflow: hidden;
  overflow-wrap: anywhere;
  white-space: pre-wrap;
  padding-bottom: 2px;
}
#status {
  grid-area: status;
  margin: 0;
  font-size: 16px;
  line-height: 1.3;
  color: #8ab4f8;
  overflow-wrap: anywhere;
}
#transcript:empty, #hint:empty, [hidden] { display: none !important; }
#nova-focus { position:absolute; inset:10px 12px 18px; display:flex; flex-direction:column; gap:12px; background:#000; overflow:hidden; }
#nova-status { margin:0; color:#8ab4f8; font-size:18px; }
#nova-draft { margin:0; color:#a8adb3; font-size:var(--cap-font,26px); line-height:1.25; max-height:2.5em; overflow:hidden; overflow-wrap:anywhere; }
#nova-answer { flex:1; min-height:0; font-size:var(--hint-font,26px); line-height:1.25; font-weight:700; overflow:hidden; }
</style>
<script src="../display-focus-flow.js?v=nova-flow-1" defer></script>
<script src="../display-focus.js?v=nova-flow-1" defer></script>
<script src="receiver.js?v=nova-flow-1" defer></script>
</head>
<body data-meta-glasses data-lens="true" data-quiet-display="1">
<div class="stage" role="presentation">
<section id="nova-focus" hidden aria-label="노바 집중 대화"><p id="nova-status"></p><p id="nova-draft"></p><div id="nova-answer"></div></section>
<p id="hint" hidden></p>
<p id="transcript"></p>
<p id="status">Connecting...</p>
</div>
</body>
</html>
