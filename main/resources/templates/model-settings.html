<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Default Model Settings</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" th:href="@{/css/model-picker.css}"/>
</head>
<body class="container py-4">

<h1 class="mb-4">Default Model Settings</h1>

<div th:if="${successMessage}" class="alert alert-success" role="alert" data-model-save-success="true" th:text="${successMessage}"></div>
<div th:if="${errorMessage}" class="alert alert-danger" role="alert" th:text="${errorMessage}"></div>

<form th:action="@{/model-settings/save}" method="post" class="mb-4" data-model-picker-surface="form">
  <div class="mb-3">
    <label for="defaultModel" class="form-label">Default model</label>
    <select id="defaultModel" name="defaultModel" class="form-select" aria-label="Default model">
      <option th:each="m : ${models}"
              th:value="${m.modelId}"
              th:text="${m.modelId}"
              th:selected="${m.modelId == currentModel}"
              th:data-provider="${m.owner}"
              th:data-features="${m.features}"
              th:data-ctx-window="${m.ctxWindow}"
              th:data-release-date="${m.releaseDate}">
      </option>
      <option th:if="${#lists.isEmpty(models)}" disabled>No models available</option>
    </select>
  </div>
  <button type="submit" class="btn btn-primary">Save</button>
</form>

<div class="mb-4">
  <strong>Current model:</strong>
  <span data-active-model-text th:text="${currentModel} ?: 'Not set'"></span>
</div>

<dl class="row mb-4" data-model-policy-summary="true">
  <dt class="col-sm-3">Backend default</dt>
  <dd class="col-sm-9" data-default-model-text th:text="${defaultModel} ?: 'Not set'"></dd>
  <dt class="col-sm-3">Provider</dt>
  <dd class="col-sm-9" data-llm-provider-text th:text="${llmProvider} ?: 'Not set'"></dd>
  <dt class="col-sm-3">Remote selection</dt>
  <dd class="col-sm-9" data-remote-model-selection-text th:text="${allowRemoteModelSelection ? 'enabled' : 'disabled'}"></dd>
</dl>

<section class="border rounded p-3 mb-4" data-embedding-runtime-diagnostics="true">
  <h2 class="h5">Embedding runtime diagnostics</h2>
  <dl class="row mb-0">
    <dt class="col-sm-3">Runtime</dt>
    <dd class="col-sm-9" id="embeddingRuntimeStatus">loading</dd>
    <dt class="col-sm-3">Target dim</dt>
    <dd class="col-sm-9" id="embeddingTargetDim">-</dd>
    <dt class="col-sm-3">Raw provider dim</dt>
    <dd class="col-sm-9" id="embeddingRawProviderDim">-</dd>
    <dt class="col-sm-3">Normalization</dt>
    <dd class="col-sm-9" id="embeddingNormalizationMode">-</dd>
    <dt class="col-sm-3">Fast fail</dt>
    <dd class="col-sm-9" id="embeddingFastFail">-</dd>
    <dt class="col-sm-3">Failure pressure</dt>
    <dd class="col-sm-9" id="embeddingFailurePressure">-</dd>
    <dt class="col-sm-3">Health mode</dt>
    <dd class="col-sm-9" id="embeddingHealthMode">-</dd>
    <dt class="col-sm-3">Backup available</dt>
    <dd class="col-sm-9" id="embeddingBackupAvailable">-</dd>
  </dl>
</section>

<hr/>
<a th:href="@{/chat}" class="btn btn-outline-secondary">Back to chat</a>

<script th:inline="javascript">
  window.initialData = {
    models: /*[[${models}]]*/ [],
    currentModel: /*[[${currentModel}]]*/ null,
    defaultModel: /*[[${defaultModel}]]*/ null,
    llmProvider: /*[[${llmProvider}]]*/ null,
    allowRemoteModelSelection: /*[[${allowRemoteModelSelection}]]*/ false
  };
</script>
<script defer th:src="@{/js/model-strategy.js}"></script>
</body>
</html>
