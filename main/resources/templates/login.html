<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operator sign-in</title>
    <style>
        :root {
            color-scheme: light;
            --bg: #f6f7f9;
            --panel: #ffffff;
            --text: #1f2933;
            --muted: #64748b;
            --line: #d9e0e8;
            --accent: #0f766e;
            --accent-strong: #0b5f59;
            --warn: #9a3412;
            --warn-bg: #fff7ed;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background: var(--bg);
            color: var(--text);
            font-family: "Segoe UI", Arial, sans-serif;
        }

        main {
            width: min(100%, 420px);
            padding: 28px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--panel);
            box-shadow: 0 18px 42px rgba(31, 41, 51, 0.08);
        }

        h1 {
            margin: 0 0 8px;
            font-size: 1.45rem;
            line-height: 1.2;
            letter-spacing: 0;
        }

        p {
            margin: 0;
            color: var(--muted);
            font-size: 0.95rem;
            line-height: 1.5;
        }

        form {
            display: grid;
            gap: 14px;
            margin-top: 24px;
        }

        label {
            display: grid;
            gap: 6px;
            color: var(--text);
            font-size: 0.9rem;
            font-weight: 600;
        }

        input {
            width: 100%;
            height: 42px;
            border: 1px solid var(--line);
            border-radius: 6px;
            padding: 0 12px;
            font: inherit;
            color: var(--text);
            background: #ffffff;
        }

        input:focus {
            outline: 3px solid rgba(15, 118, 110, 0.16);
            border-color: var(--accent);
        }

        button {
            height: 42px;
            border: 0;
            border-radius: 6px;
            background: var(--accent);
            color: #ffffff;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
        }

        button:hover {
            background: var(--accent-strong);
        }

        .notice {
            margin-top: 16px;
            padding: 10px 12px;
            border: 1px solid #fed7aa;
            border-radius: 6px;
            background: var(--warn-bg);
            color: var(--warn);
            font-size: 0.9rem;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            justify-content: space-between;
            margin-top: 18px;
            font-size: 0.9rem;
        }

        a {
            color: var(--accent-strong);
            font-weight: 700;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
<main aria-labelledby="login-title">
    <h1 id="login-title">Operator sign-in</h1>
    <p>Use an operator account to access protected administration surfaces.</p>

    <!-- LOGIN_STATUS -->

    <form method="post" action="/login">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username" required>

        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>

        <label>
            <input name="remember-me" type="checkbox">
            Remember me
        </label>
        <!-- CSRF_INPUT -->
        <button type="submit">Sign in</button>
    </form>

    <div class="actions">
        <a href="/chat-ui">Back to chat</a>
    </div>
</main>
</body>
</html>
