# Opt-in only: the integrated launcher activates local,meta-display.
# CLI port arguments also pin these values against development environment overrides.
spring:
  datasource:
    # Reuse the existing ChatSession/ChatMessage store across local server restarts.
    # An explicitly configured LMS_DB_URL continues to take precedence.
    url: ${LMS_DB_URL:jdbc:h2:file:./var/meta-display-db/lmsdb;MODE=MariaDB;DATABASE_TO_UPPER=false}
server:
  port: 18180
management:
  server:
    port: 18181
netty:
  port: 18182
conversate:
  cost:
    # Fold6 testing: keep usage estimates, never require dollar-budget approvals.
    enforce-limits: false
  asr:
    cloud:
      # Complete local-fallback utterances only; Soniox/Deepgram continuous streaming is unchanged.
      utterance-provider: ${CONVERSATE_STT_UTTERANCE_PROVIDER:economy}
      # Renew only the provider stream before this bound; microphone session has no timer.
      stream-seconds: 75
  transcript:
    rolling-enabled: true
    visible-chars: ${CONVERSATE_VISIBLE_CHARS:200}
    context-chars: ${CONVERSATE_CONTEXT_CHARS:2000}
  display-ttl-ms: ${CONVERSATE_DISPLAY_TTL_MS:20000}
  context-ttl-ms: ${CONVERSATE_CONTEXT_TTL_MS:120000}
  cue:
    cooldown-ms: 10000
    trigger-min-delta-chars: ${CONVERSATE_CUE_TRIGGER_MIN_DELTA:120}
    trigger-quiet-ms: ${CONVERSATE_CUE_TRIGGER_QUIET_MS:2500}
    force-after-ms: ${CONVERSATE_CUE_FORCE_AFTER_MS:180000}
    force-min-delta-chars: ${CONVERSATE_CUE_FORCE_MIN_DELTA:50}
    total-timeout-ms: 12000
    gate-timeout-ms: 3000
    hint-timeout-ms: 6500
    max-attempts-per-stage: 3
    # Hangul runs ~1 token/char: 1000-char target + JSON envelope needs ~1.5k headroom.
    hint-target-chars: ${CONVERSATE_CUE_HINT_TARGET_CHARS:1000}
    # Hint-input past window (not output length, not display TTL). Fold UI wiring is separate.
    use-past: ${CONVERSATE_CUE_USE_PAST:true}
    past-max-turns: ${CONVERSATE_CUE_PAST_MAX_TURNS:4}
    past-max-chars: ${CONVERSATE_CUE_PAST_MAX_CHARS:1600}
    max-output-tokens: ${CONVERSATE_CUE_MAX_OUTPUT_TOKENS:1536}
    max-request-usd: ${CONVERSATE_MAX_REQUEST_USD:0.50}
    local-support-enabled: true
    # Operator preference tier: eligible candidates from this provider sort first.
    preferred-provider: ${CONVERSATE_CUE_PREFERRED_PROVIDER:gemini}
    # Process-local spending ceilings. A fresh, externally verified snapshot may
    # supply verified-balance-usd / verified-requests-remaining; absence is unknown.
    accounts:
      openai:
        daily-budget-usd: ${CONVERSATE_OPENAI_DAILY_USD:5.00}
        observed-at-ms: ${CONVERSATE_OPENAI_QUOTA_OBSERVED_AT_MS:0}
        verified-free-requests-remaining: ${CONVERSATE_OPENAI_VERIFIED_FREE_REMAINING:0}
      gemini:
        daily-budget-usd: ${CONVERSATE_GEMINI_DAILY_USD:0.50}
        observed-at-ms: ${CONVERSATE_GEMINI_QUOTA_OBSERVED_AT_MS:0}
        verified-free-requests-remaining: ${CONVERSATE_GEMINI_VERIFIED_FREE_REMAINING:0}
      groq:
        # Paid Groq fallback is prohibited, regardless of cost.enforce-limits.
        daily-budget-usd: 0
        observed-at-ms: ${CONVERSATE_GROQ_QUOTA_OBSERVED_AT_MS:0}
        verified-free-requests-remaining: ${CONVERSATE_GROQ_VERIFIED_FREE_REMAINING:0}
    # Official standard USD / 1M tokens, checked 2026-09-16. Never assume a cache hit.
    # A model-name override also needs a matching priced-model and verified prices.
    routes:
      openai-economy:
        gate: true
        quality: 1
        priced-model: gpt-5.6-luna
        input-usd-per-million: 0.20
        output-usd-per-million: 1.20
        expected-latency-ms: 1000
        daily-request-limit: ${CONVERSATE_OPENAI_DAILY_REQUEST_LIMIT:1000}
      openai-balanced:
        quality: 3
        priced-model: gpt-5.6-terra
        input-usd-per-million: 2.00
        output-usd-per-million: 12.00
        expected-latency-ms: 2200
        daily-request-limit: ${CONVERSATE_OPENAI_REASONING_DAILY_REQUEST_LIMIT:100}
      openai-premium:
        quality: 4
        priced-model: gpt-5.6-sol
        input-usd-per-million: 4.00
        output-usd-per-million: 20.00
        expected-latency-ms: 3000
        daily-request-limit: ${CONVERSATE_PREMIUM_DAILY_REQUEST_LIMIT:20}
      gemini-cue:
        gate: true
        quality: 1
        priced-model: gemini-3.5-flash-lite
        input-usd-per-million: 0.30
        output-usd-per-million: 2.50
        expected-latency-ms: 900
        daily-request-limit: ${CONVERSATE_GEMINI_DAILY_REQUEST_LIMIT:1000}
      gemini-pro:
        quality: 3
        priced-model: gemini-3.8-flash
        # Introductory rate through 2026-12-31; policy applies published 2027 rates.
        input-usd-per-million: 0.75
        output-usd-per-million: 3.75
        expected-latency-ms: 1800
        daily-request-limit: ${CONVERSATE_GEMINI_PRO_DAILY_REQUEST_LIMIT:100}
      api3:
        gate: false
        quality: 3
        priced-model: openai/gpt-oss-120b
        input-usd-per-million: 0.15
        output-usd-per-million: 0.60
        expected-latency-ms: 800
        daily-request-limit: ${CONVERSATE_GROQ_DAILY_REQUEST_LIMIT:500}
      groq-gate:
        gate: true
        quality: 1
        priced-model: openai/gpt-oss-20b
        input-usd-per-million: 0.075
        output-usd-per-million: 0.30
        expected-latency-ms: 800
        daily-request-limit: ${CONVERSATE_GROQ_DAILY_REQUEST_LIMIT:500}
  display:
    enabled: true
    segment-seconds: ${CONVERSATE_DISPLAY_SEGMENT_SECONDS:0}
    # Rolling transcript share sent to the glasses lens; the newest tail is kept.
    lens-conversation-chars: ${CONVERSATE_LENS_CONVERSATION_CHARS:280}
    # Anonymous, owner-bound Fold6 development path; other profiles stay opt-in.
    phone-test-enabled: ${CONVERSATE_DISPLAY_PHONE_TEST_ENABLED:true}
    audio:
      enabled: ${CONVERSATE_DISPLAY_AUDIO_ENABLED:true}
  focus:
    # Nova Focus (노바 wake-word). Owners without stored settings start armed on
    # this profile; an explicit per-owner toggle still wins over this default.
    default-enabled: ${CONVERSATE_FOCUS_DEFAULT_ENABLED:true}
    # Evidence-sensitive web policy: aggressive AUTO infers search for
    # knowledge/recency questions; arithmetic/session-context/casual stay local.
    web-aggressive-enabled: ${CONVERSATE_FOCUS_WEB_AGGRESSIVE:true}
    unknown-web-enabled: true
    unknown-web-scoped-enabled: ${CONVERSATE_FOCUS_UNKNOWN_WEB_SCOPED:true}
    # Lens-facing web answers are compacted to this code-point budget.
    lens-answer-chars: ${CONVERSATE_FOCUS_LENS_ANSWER_CHARS:280}
    lens-source-suffix: ${CONVERSATE_FOCUS_LENS_SOURCE_SUFFIX:true}
    # Soft model preference for web-grounded focus answers. Must be an existing
    # selectable llmrouter route; the request stays AUTO when it is not.
    web-model: ${CONVERSATE_FOCUS_WEB_MODEL:llmrouter.gemini-pro}
    # Soft default for AUTO-routing focus answers: must resolve to an existing
    # selectable catalog route, otherwise the local default keeps its place.
    default-model: ${CONVERSATE_FOCUS_DEFAULT_MODEL:llmrouter.gemini-pro}
demo:
  interview:
    # Conversate uses the existing authenticated owner and generation boundary.
    enabled: false
    # Trust this explicit HTTPS origin only through the existing loopback/host guard.
    fixed-public-origin: ${APP_PUBLIC_BASE_URL:https://abandonwareai.kro.kr}
  auth:
    # PROTO: prototype-open auth (docs/PROTOTYPE_AUTH.md). Never enable on public/prod deploys.
    proto-open: ${DEMO_AUTH_PROTO_OPEN:true}
  # Jev (typesafe-ai/jev) fast decision signal on Vercel AI Gateway native /v1/evaluate.
  # Lifecycle: off -> mock -> shadow(log only, routing untouched) -> on(restricted).
  # 401 means an invalid/expired key; a ZDR-related 403 can be a plan gate. Keep mode off
  # until a verified smoke and explicit paid/budget admission. Fail-open: every gap
  # defers to the deterministic local rules path. Never on PCM/beginVoice/reconnect.
  # Surface overrides (focus/cue/main): set via env/-D only — never a ${X:} default,
  # which resolves to "" and forces that surface off. Rollout order: focus -> cue -> main.
  jev:
    mode: ${DEMO_JEV_MODE:off}
    endpoint: ${AWX_JEV_ENDPOINT:https://ai-gateway.vercel.sh/v1/evaluate}
    model: ${AWX_JEV_MODEL:typesafe-ai/jev}
    credential-env: AI_GATEWAY_API_KEY
    connect-timeout-ms: ${DEMO_JEV_CONNECT_TIMEOUT_MS:250}
    request-timeout-ms: ${DEMO_JEV_REQUEST_TIMEOUT_MS:800}
    decision-wait-ms: ${DEMO_JEV_DECISION_WAIT_MS:150}
    max-in-flight: ${DEMO_JEV_MAX_IN_FLIGHT:2}
    max-state-bytes: ${DEMO_JEV_MAX_STATE_BYTES:8192}
    max-response-bytes: ${DEMO_JEV_MAX_RESPONSE_BYTES:65536}
    # Free promo ended ~2026-09-25; unknown budget skips the call. allow-paid is the
    # explicit paid opt-in; free-only=false also admits (operator-owned budget).
    # Jev charges Vercel AI Gateway (AI_GATEWAY_API_KEY) credits independently
    # of the ChatGPT OAuth plan/credits; DEMO_JEV_* env still overrides.
    free-only: ${DEMO_JEV_FREE_ONLY:false}
    allow-paid: ${DEMO_JEV_ALLOW_PAID:true}
    free-window-end: ${DEMO_JEV_FREE_WINDOW_END:2026-09-26T00:00:00Z}

# Pro/Enterprise only; enabling this on Hobby can return HTTP 403 plan_gate.
jev:
  gateway:
    zero-data-retention: ${DEMO_JEV_ZDR:false}

# Focus web answers may select Gemini Flash through the existing route
# allowlist; the global allow-remote-model-selection flag stays false.
app:
  ai:
    remote-model-selection-routes: ${CHAT_REMOTE_MODEL_SELECTION_ROUTES:api3,gemini-pro}

# Existing routes remain fallback-only for unrelated llmrouter.auto consumers.
# Conversate explicitly selects these API roles after credential/health checks.
llmrouter:
  models:
    openai-economy:
      enabled: ${LLMROUTER_OPENAI_ECONOMY_ENABLED:true}
      provider: openai
      stage: chat
      fallback-only: true
      name: ${LLMROUTER_OPENAI_ECONOMY_NAME:gpt-5.6-luna}
      base-url: ${LLMROUTER_OPENAI_ECONOMY_BASE_URL:https://api.openai.com/v1}
      credential-env: OPENAI_API_KEY
      weight: 0.0
    openai-balanced:
      enabled: ${LLMROUTER_OPENAI_BALANCED_ENABLED:true}
      name: ${LLMROUTER_OPENAI_BALANCED_NAME:gpt-5.6-terra}
    openai-premium:
      enabled: ${LLMROUTER_OPENAI_PREMIUM_ENABLED:true}
      name: ${LLMROUTER_OPENAI_PREMIUM_NAME:gpt-5.6-sol}
    gemini-pro:
      enabled: ${LLMROUTER_GEMINI_PRO_ENABLED:true}
      name: ${LLMROUTER_GEMINI_PRO_NAME:gemini-3.8-flash}
    api3:
      credential-env: GROQ_API_KEY
    groq-gate:
      enabled: true
      provider: groq
      stage: chat
      fallback-only: true
      name: openai/gpt-oss-20b
      base-url: https://api.groq.com/openai/v1
      credential-env: GROQ_API_KEY
      weight: 0.0
    gemini-cue:
      enabled: ${LLMROUTER_GEMINI_CUE_ENABLED:true}
      provider: gemini
      stage: chat
      fallback-only: true
      name: ${LLMROUTER_GEMINI_CUE_NAME:gemini-3.5-flash-lite}
      base-url: ${LLMROUTER_GEMINI_CUE_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai}
      credential-env: GEMINI_API_KEY
      weight: 0.0

# Only the registered router purpose is enabled for these real-time cue calls.
gemini:
  gateway:
    speech:
      enabled: ${GEMINI_GATEWAY_SPEECH_ENABLED:true}
    # Google Search Grounding stays a per-call opt-in on the native surface;
    # this flag is only the gateway-side kill switch.
    grounding:
      enabled: ${GEMINI_GATEWAY_GROUNDING_ENABLED:true}
    purpose:
      router:
        enabled: ${GEMINI_GATEWAY_ROUTER_ENABLED:true}

# Official and account Limits checked 2026-09-16; fresh account evidence is mandatory.
# All devices using this organization must point to the same ledger. It is not a balance API.
groq:
  free-tier:
    safety-margin: ${GROQ_FREE_SAFETY_MARGIN:0.10}
    evidence: ${GROQ_FREE_EVIDENCE:data/usage/groq-free-plan.json}
    # Account evidence freshness, NOT API key expiry. 1-365 days; default 90 days.
    evidence-max-age-ms: ${GROQ_FREE_EVIDENCE_MAX_AGE_MS:7776000000}
    ledger: ${GROQ_FREE_LEDGER:data/usage/groq-free-reservations.jsonl}

# Local/display-only opt-in for the read-only agent DB context surface
# (/agent/db-context/*). The public default stays disabled; kill switch:
# set agent.db-context.enabled=false or drop this block.
agent:
  db-context:
    enabled: true

# ChatGPT OAuth ("Sign in with ChatGPT") foundation. Token values live only in
# the gitignored .secrets store; this file carries paths/endpoints/policy only.
# Runtime harness: scripts/chatgpt_oauth_flow.py (login|status|refresh|
# get-token|sync-models|test-smoke). Java contract:
# data/agent-handoff/chatgpt-oauth/CONTRACT.md
chatgpt:
  oauth:
    enabled: ${CHATGPT_OAUTH_ENABLED:true}
    credentials-file: ${CHATGPT_OAUTH_CREDENTIALS:.secrets/chatgpt_oauth_credentials.json}
    models-file: ${CHATGPT_OAUTH_MODELS:data/agent-handoff/chatgpt-oauth/models.json}
    token-endpoint: https://auth.openai.com/api/accounts/oauth/token
    refresh-buffer-seconds: 300
    # User report only; remaining balance and exact expiry remain unobserved.
    benefit:
      reported-grant-credits: 62500
      reported-expires-on: "2026-12-31"
      operational-cutoff: ${CHATGPT_OAUTH_BENEFIT_OPERATIONAL_CUTOFF:}
